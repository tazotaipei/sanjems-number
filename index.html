<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產品保固登錄系統</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 30px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>產品保固登錄</h2>
    <form id="warrantyForm">
        <div class="form-group">
            <label for="name">客戶姓名</label>
            <input type="text" id="name" required placeholder="請輸入姓名">
        </div>
        <div class="form-group">
            <label for="phone">聯絡電話</label>
            <input type="tel" id="phone" required placeholder="請輸入手機號碼">
        </div>
        <div class="form-group">
            <label for="serialNumber">產品序號</label>
            <input type="text" id="serialNumber" required placeholder="請輸入商品序號">
        </div>
        <button type="submit">提交保固資訊</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbx4gj-4b676sRWeFUKfPvaZX-K-yN5aufzoJ6jeQIBbvF4Og2fD2K5f64DpdDMnvdUq/exec';

    document.getElementById('warrantyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const messageDiv = document.getElementById('message');
        messageDiv.style.color = '#333';
        messageDiv.innerText = '資料傳送中...';

        const data = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            serialNumber: document.getElementById('serialNumber').value
        };

        // 使用 fetch API 發送 POST 請求到 Google Sheets
        fetch(scriptUrl, {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            if(result.result === 'success') {
                messageDiv.style.color = 'green';
                messageDiv.innerText = '🎉 保固登錄成功！';
                document.getElementById('warrantyForm').reset();
            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = '❌ 登錄失敗，請稍後再試。';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            messageDiv.style.color = 'red';
            messageDiv.innerText = '❌ 系統發生錯誤。';
        });
    });
</script>

</body>
</html>
